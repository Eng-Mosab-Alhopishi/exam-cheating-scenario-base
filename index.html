<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الوجه - Face Tracking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        #video {
            display: none; /* إخفاء الفيديو لأنه يعرض على Canvas */
        }
        #canvas {
            border: 2px solid #333;
            border-radius: 10px;
            max-width: 100%;
        }
        #alert-box {
            margin-top: 20px;
            padding: 10px;
            background-color: #ffcccb;
            border: 1px solid #ff6666;
            border-radius: 5px;
            display: none;
            color: #d8000c;
        }
        .stats {
            margin-top: 20px;
            text-align: left;
            display: inline-block;
        }
        .stats div {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>نظام تتبع الوجه - Face Tracking</h1>
    <video id="video"></video>
    <canvas id="canvas"></canvas>
    <div id="alert-box"></div>
    <div class="stats">
        <div id="head-turn-left-count">عدد مرات التفت يسارًا: 0</div>
        <div id="head-turn-right-count">عدد مرات التفت يمينًا: 0</div>
        <div id="head-tilt-up-count">عدد مرات الميل للأعلى: 0</div>
        <div id="head-tilt-down-count">عدد مرات الميل للأسفل: 0</div>
        <div id="mouth-open-count">عدد مرات فتح الفم: 0</div>
        <div id="face-presence-count">حالة الوجه: موجود</div>
    </div>
    <p style="color: red; font-weight: bold;">
        ملاحظة: يرجى التأكد من السماح للمتصفح بالوصول إلى الكاميرا.
    </p>
    <!-- تضمين مكتبة Mediapipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

    <!-- تضمين ملف JavaScript -->
    <script src="script.js"></script>
</body>
</html>
